name: Temporary ktlint format for SugarWear Share feature branch

on:
  push:
    branches:
      - feat/dexcom-share-upload-20261119

permissions:
  contents: write

concurrency:
  group: format-sugarwear-share
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'FreDiabetics/sugarwear'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: ''
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: false
      - name: Install Android API 37
        run: |
          test -s "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          android --no-metrics sdk install "platforms;android-37" "build-tools;37.0.0" --canary
      - name: Apply project's existing ktlint formatter
        run: ./gradlew ktlintFormat
      - name: Commit formatting only on the isolated Share branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app-sugarwear/src; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app-sugarwear/src
          git diff --cached --check
          git commit -m 'style: format experimental Share integration with ktlint'
          git push origin HEAD:feat/dexcom-share-upload-20261119
